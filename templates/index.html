<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DreamUp🏙️ - Reality Rewrite</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            color: #222;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        h1 {
            font-size: 2.5rem;
            color: white;
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-shadow: 0px 3px 6px rgba(0,0,0,0.2);
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.15);
            padding: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.02);
        }

        input[type="file"] {
            margin: 20px 0;
            padding: 10px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="file"]:hover {
            border-color: #4facfe;
        }

        select {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s ease;
        }

        select:hover {
            border-color: #4facfe;
            box-shadow: 0px 0px 8px rgba(79, 172, 254, 0.3);
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        }

        img {
            border-radius: 15px;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.3);
            margin-top: 20px;
            max-width: 90%;
            transition: opacity 0.6s ease;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        footer {
            margin-top: 40px;
            color: white;
            opacity: 0.8;
            font-size: 0.9rem;
        }
    </style>

    <script>
        function showLoader() {
            document.querySelector('.loader').style.display = 'block';
        }
    </script>
</head>
<body>
    <h1>DreamUp🏙️</h1>
    <div class="card">
        <form action="/generate" method="post" enctype="multipart/form-data" onsubmit="showLoader()">
            <input type="file" name="image" accept="image/*" required>
            
            <select name="theme">
                <option value="futuristic">Futuristic</option>
                <option value="nature">Nature</option>
                <option value="cyberpunk">Cyberpunk</option>
            </select>

            <button type="submit">✨ Generate Image</button>
            <div class="loader"></div>
        </form>
    </div>

    {% if original %}
        <h2 style="color:white;margin-top:30px;">Original Image</h2>
        <img src="{{ original }}" alt="Original Image">
    {% endif %}

    {% if result %}
        <h2 style="color:white;margin-top:30px;">Generated ({{ theme|capitalize }})</h2>
        <img src="{{ result }}" alt="Generated Image">
    {% endif %}

    <footer>Powered by <b>DreamUp AI</b> • Reality Reimagined ✨</footer>
</body>
</html>
